{# Abas da "Minha conta" da ONG. Uso: {% include 'componentes/abas_ong.html' with aba='perfil' %} #}
<nav aria-label="Seções da conta da ONG">
  <ul class="nav nav-underline mb-4">
    <li class="nav-item">
      <a class="nav-link {% if aba == 'perfil' %}active{% endif %}"
         href="{% url 'ongs:minha_ong' %}"
         {% if aba == 'perfil' %}aria-current="page"{% endif %}>
        Situação e perfil
      </a>
    </li>

    {% if perfil == 'ong' %}
      <li class="nav-item">
        <a class="nav-link {% if aba == 'necessidades' %}active{% endif %}"
           href="{% url 'ongs:necessidades' %}"
           {% if aba == 'necessidades' %}aria-current="page"{% endif %}>
          Necessidades
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if aba == 'reservas' %}active{% endif %}"
           href="{% url 'colheita:minhas_reservas' %}"
           {% if aba == 'reservas' %}aria-current="page"{% endif %}>
          Minhas reservas
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if aba == 'doacoes' %}active{% endif %}"
           href="{% url 'doacoes:a_confirmar' %}"
           {% if aba == 'doacoes' %}aria-current="page"{% endif %}>
          Doações a confirmar
        </a>
      </li>
    {% endif %}
  </ul>
</nav>
