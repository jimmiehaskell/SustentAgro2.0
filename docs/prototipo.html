<title>Protótipo SustentAgro 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: barra do protótipo fixa no topo; abaixo, o site (largura total ou moldura de celular de 360 px),
   que se adapta por container query para o modo celular funcionar sem mudar a janela. */
:root {
  /* Paleta "Campo suave" (D-32) — tema claro */
  --fundo: #f6f8f3;
  --superficie: #ffffff;
  --superficie-2: #eef2ea;
  --texto: #1f241c;
  --suave: #5c6657;
  --borda: #dde4d6;
  --verde: #3d7a16;
  --verde-forte: #2f6110;
  --sobre-verde: #ffffff;
  --limao: #a6e36b;
  --sobre-limao: #1d1f1c;
  --apoio: #eaf7dc;
  --sobre-apoio: #2f5e10;
  --link: #3d7a16;
  --numero: #3d7a16;
  --perigo: #b42318;
  --perigo-apoio: #fdecea;
  --aviso: #8a5a00;
  --aviso-apoio: #fff4d6;
  --sombra: 0 1px 2px rgb(31 36 28 / .06), 0 2px 8px rgb(31 36 28 / .04);
  /* barra do protótipo: igual nos dois temas, para não se confundir com o site */
  --proto-fundo: #1d1f1c;
  --proto-texto: #e6eae2;
  --proto-borda: #3a4036;
  --fonte-display: "Montserrat", "Segoe UI", system-ui, sans-serif;
  --fonte-texto: "Figtree", "Segoe UI", system-ui, sans-serif;
  --fonte-mono: "JetBrains Mono", Consolas, monospace;
  --raio: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #1a1d19; --superficie: #232822; --superficie-2: #2a3028; --texto: #e6eae2; --suave: #a0a89a;
    --borda: #343a31; --verde: #4a8a1f; --verde-forte: #5a9c2c; --sobre-verde: #f3f7ee; --limao: #a6e36b;
    --sobre-limao: #1a1d19; --apoio: #2c3a24; --sobre-apoio: #c5ee9c; --link: #a6e36b; --numero: #b9ea88;
    --perigo: #ff8a80; --perigo-apoio: #3a1f1d; --aviso: #f2c14e; --aviso-apoio: #3a3020;
    --sombra: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fundo: #1a1d19; --superficie: #232822; --superficie-2: #2a3028; --texto: #e6eae2; --suave: #a0a89a;
  --borda: #343a31; --verde: #4a8a1f; --verde-forte: #5a9c2c; --sobre-verde: #f3f7ee; --limao: #a6e36b;
  --sobre-limao: #1a1d19; --apoio: #2c3a24; --sobre-apoio: #c5ee9c; --link: #a6e36b; --numero: #b9ea88;
  --perigo: #ff8a80; --perigo-apoio: #3a1f1d; --aviso: #f2c14e; --aviso-apoio: #3a3020;
  --sombra: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--fonte-texto); font-size: 15px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--fonte-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Barra do protótipo ---------- */
.proto {
  position: sticky; top: 0; z-index: 20; background: var(--proto-fundo); color: var(--proto-texto);
  padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--proto-borda);
}
.proto .dentro {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.proto .tag { font-family: var(--fonte-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a6e36b; }
.proto label { font-size: 12px; display: flex; align-items: center; gap: 6px; color: #b9c0b3; }
.proto select, .proto .pbtn {
  background: #2a2e27; color: var(--proto-texto); border: 1px solid var(--proto-borda); border-radius: 6px;
  padding: 5px 8px; font-size: 13px; color-scheme: dark;
}
.proto .pbtn { cursor: pointer; }
.proto .pbtn[aria-pressed="true"] { background: #a6e36b; color: #1d1f1c; border-color: #a6e36b; font-weight: 600; }
.proto .direita { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Palco e site ---------- */
.palco { padding-block: 0 48px; }
.palco.celular { padding-block: 24px 48px; padding-left: 16px; padding-right: 16px; }
.site { container: site / inline-size; background: var(--fundo); min-height: 70vh; }
.palco.celular .site {
  max-width: 360px; margin: 0 auto; border: 1px solid var(--borda); border-radius: 22px; overflow: hidden;
  box-shadow: 0 10px 30px rgb(0 0 0 / .18); min-height: 640px;
}
.largura { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.palco.celular .largura { padding-left: 16px; padding-right: 16px; }

/* Menu do site */
.menu { background: var(--superficie); border-bottom: 1px solid var(--borda); }
.menu .largura { display: flex; align-items: center; gap: 22px; padding-block: 12px; flex-wrap: wrap; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--fonte-display); font-weight: 800; font-size: 20px; color: var(--texto); text-decoration: none; letter-spacing: -.01em; }
.marca svg { width: 26px; height: 26px; }
.menu nav { display: flex; gap: 18px; align-items: center; }
.menu nav a, .menu .acoes a { color: var(--texto); text-decoration: none; font-weight: 500; font-size: 14.5px; padding-block: 4px; }
.menu nav a.ativo { box-shadow: inset 0 -2px 0 var(--verde); font-weight: 700; }
.menu .acoes { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.menu .quem { font-size: 13px; color: var(--suave); }
.menu .acoes a.btn-primario { color: var(--sobre-verde); padding: 6px 14px; }
.btn-menu { display: none; margin-left: auto; background: none; border: 1px solid var(--borda); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
@container site (max-width: 700px) {
  .btn-menu { display: inline-block; }
  .menu nav, .menu .acoes { display: none; width: 100%; flex-direction: column; align-items: flex-start; gap: 6px; margin-left: 0; }
  .menu.aberto nav, .menu.aberto .acoes { display: flex; }
}

/* Botões e campos (equivalentes: .btn .btn-primary / .btn-outline-* / .form-control do Bootstrap) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; padding: 8px 16px; font-weight: 700; font-size: 14px; cursor: pointer; border: 1px solid transparent; text-decoration: none; }
.btn-primario { background: var(--verde); color: var(--sobre-verde); }
.btn-primario:hover { background: var(--verde-forte); }
.btn-contorno { background: transparent; color: var(--texto); border-color: var(--borda); }
.btn-contorno:hover { background: var(--superficie-2); }
.btn-perigo { background: transparent; color: var(--perigo); border-color: var(--perigo); }
.btn-pequeno { padding: 5px 12px; font-size: 13px; }
.campo { display: grid; gap: 5px; }
.campo > label, .campo > .rotulo-campo { font-size: 13.5px; font-weight: 600; }
.campo .ajuda { font-size: 12.5px; color: var(--suave); }
.campo .erro { font-size: 12.5px; color: var(--perigo); font-weight: 600; }
.entrada { width: 100%; padding: 8px 10px; border: 1px solid var(--borda); border-radius: 6px; background: var(--superficie); }
textarea.entrada { min-height: 90px; resize: vertical; }
.grade-form { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grade-form .inteira { grid-column: 1 / -1; }
@container site (max-width: 640px) { .grade-form { grid-template-columns: 1fr; } }
.opcoes { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.opcoes label { display: flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 500; }

/* Peças comuns */
.secao { padding-block: 36px; display: grid; gap: 20px; }
.cabeca-secao { display: grid; gap: 6px; }
.cabeca-secao h2 { font-size: 26px; }
.cabeca-secao p { color: var(--suave); max-width: 64ch; }
.cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); box-shadow: var(--sombra); }
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.selo-apoio { background: var(--apoio); color: var(--sobre-apoio); }
.selo-limao { background: var(--limao); color: var(--sobre-limao); }
.selo-neutro { background: var(--superficie-2); color: var(--suave); }
.selo-aviso { background: var(--aviso-apoio); color: var(--aviso); }
.selo-perigo { background: var(--perigo-apoio); color: var(--perigo); }
.ods { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--texto); }
.ods i { width: 20px; height: 20px; border-radius: 4px; display: inline-grid; place-items: center; font-style: normal; color: #fff; font-size: 11px; font-weight: 800; }
.barra { height: 10px; border-radius: 99px; background: var(--superficie-2); overflow: hidden; }
.barra > span { display: block; height: 100%; background: var(--verde); border-radius: 99px; }
.barra.cheia > span { background: var(--limao); }
.num { font-variant-numeric: tabular-nums; }
.aviso-caixa { border-radius: var(--raio); padding: 14px 16px; display: grid; gap: 4px; }
.aviso-caixa.info { background: var(--apoio); color: var(--sobre-apoio); }
.aviso-caixa.alerta { background: var(--aviso-apoio); color: var(--aviso); }
.aviso-caixa.erro { background: var(--perigo-apoio); color: var(--perigo); }
.vazio { text-align: center; padding: 40px 16px; color: var(--suave); display: grid; gap: 10px; justify-items: center; }

/* Rótulo de rastreabilidade (parte do protótipo, não do site) */
.rastreio {
  font-family: var(--fonte-mono); font-size: 11.5px; color: var(--suave); border: 1px dashed var(--borda);
  border-radius: 6px; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 16px;
}
.rastreio b { color: var(--texto); }
.rastreio .camada { background: var(--superficie-2); padding: 1px 6px; border-radius: 4px; }
body.sem-rotulos .rastreio { display: none; }

/* Capa de ONG: sulcos de plantio desenhados em CSS, na cor da ONG */
.capa { position: relative; background-color: var(--cor-capa); background-image: repeating-linear-gradient(-28deg, rgb(255 255 255 / .10) 0 10px, transparent 10px 26px), linear-gradient(160deg, rgb(255 255 255 / .12), rgb(0 0 0 / .18)); }
.logo-ong { width: 56px; height: 56px; border-radius: 12px; background: var(--superficie); color: var(--cor-capa); display: grid; place-items: center; font-family: var(--fonte-display); font-weight: 800; font-size: 20px; border: 3px solid var(--superficie); box-shadow: var(--sombra); }

/* ---------- Tela 1: Início ---------- */
.heroi { background: var(--superficie); border-bottom: 1px solid var(--borda); }
.heroi .largura { padding-block: 44px 40px; display: grid; gap: 18px; }
.heroi h1 { font-size: clamp(30px, 5cqi, 46px); max-width: 18ch; letter-spacing: -.02em; }
.heroi h1 em { font-style: normal; background: linear-gradient(transparent 62%, var(--limao) 62% 92%, transparent 92%); padding-inline: 2px; }
.heroi p { color: var(--suave); max-width: 58ch; font-size: 16.5px; }
.busca { display: flex; gap: 8px; max-width: 620px; flex-wrap: wrap; }
.busca .entrada { flex: 1 1 260px; padding: 11px 14px; font-size: 15.5px; }
.grade-ods { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@container site (max-width: 760px) { .grade-ods { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container site (max-width: 420px) { .grade-ods { grid-template-columns: 1fr; } }
.cartao-ods { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 14px; text-align: left; cursor: pointer; color: var(--texto); }
.cartao-ods:hover { border-color: var(--verde); }
.cartao-ods .quad { grid-row: span 2; width: 52px; height: 52px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-family: var(--fonte-display); font-weight: 800; font-size: 24px; }
.cartao-ods strong { font-size: 14.5px; line-height: 1.3; }
.cartao-ods span { font-size: 13px; color: var(--suave); }
.carrossel { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.carrossel > * { scroll-snap-align: start; }
.carrossel { scroll-behavior: smooth; scrollbar-width: none; }
.carrossel::-webkit-scrollbar { display: none; }
.cabeca-carrossel { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.setas { display: flex; gap: 8px; }
.seta { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); display: grid; place-items: center; cursor: pointer; box-shadow: var(--sombra); }
.seta:hover:not(:disabled) { border-color: var(--verde); color: var(--verde); }
.seta:disabled { opacity: .35; cursor: default; box-shadow: none; }
.seta svg { width: 18px; height: 18px; }
.sobre { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; }
@container site (max-width: 760px) { .sobre { grid-template-columns: 1fr; } }
.sobre p { color: var(--suave); max-width: 62ch; }
.equipe { columns: 2; gap: 20px; padding-left: 18px; margin: 0; font-size: 14px; }
.equipe li { break-inside: avoid; margin-bottom: 4px; }
.rodape { border-top: 1px solid var(--borda); background: var(--superficie); }
.rodape .largura { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; font-size: 13px; color: var(--suave); }

/* ---------- Tela 2: Lista ---------- */
.lista-layout { display: grid; grid-template-columns: 250px 1fr; gap: 24px; align-items: start; }
@container site (max-width: 760px) { .lista-layout { grid-template-columns: 1fr; } }
.filtros { padding: 16px; display: grid; gap: 14px; }
.filtros h3 { font-size: 16px; }
.cartoes-ong { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@container site (max-width: 900px) { .cartoes-ong { grid-template-columns: 1fr; } }
.cartao-ong { overflow: hidden; display: grid; grid-template-rows: auto 1fr; cursor: pointer; text-align: left; padding: 0; color: var(--texto); }
.cartao-ong:hover { border-color: var(--verde); }
.cartao-ong .capa { height: 86px; }
.cartao-ong .logo-ong { position: absolute; left: 14px; bottom: -22px; width: 48px; height: 48px; font-size: 17px; }
.cartao-ong .corpo { padding: 30px 14px 14px; display: grid; gap: 8px; align-content: start; }
.cartao-ong h3 { font-size: 17px; }
.cartao-ong .resumo { font-size: 13.5px; color: var(--suave); }
.linha-ods { display: flex; flex-wrap: wrap; gap: 6px 10px; }
.precisa { background: var(--superficie-2); border-radius: 6px; padding: 8px 10px; font-size: 13px; display: grid; gap: 6px; }
.precisa .barra { background: var(--borda); }
.precisa b { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--numero); }
.cidade { font-size: 12.5px; color: var(--suave); display: inline-flex; gap: 4px; align-items: center; }
.contagem { font-size: 14px; color: var(--suave); }

/* ---------- Tela 3: Página da ONG ---------- */
.ong-capa { height: 180px; }
.ong-capa .largura { position: relative; height: 100%; }
.ong-capa .logo-ong { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: -36px; width: 84px; height: 84px; font-size: 28px; border-radius: 16px; }
.ong-cabeca { padding-block: 48px 8px; display: grid; gap: 10px; }
.ong-cabeca h1 { font-size: clamp(26px, 4cqi, 36px); }
.ong-cabeca .slogan { color: var(--suave); font-size: 16.5px; }
.ong-layout { display: grid; grid-template-columns: 1fr 320px; gap: 28px; align-items: start; padding-block: 20px 36px; }
@container site (max-width: 860px) { .ong-layout { grid-template-columns: 1fr; } }
.necessidade { padding: 16px; display: grid; gap: 10px; }
.necessidade .topo { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.necessidade h3 { font-size: 17px; }
.necessidade .quanto { font-size: 14px; }
.necessidade .quanto strong { color: var(--numero); font-size: 16px; }
.lateral { padding: 18px; display: grid; gap: 14px; }
.lateral h3 { font-size: 17px; }
.lateral dl { margin: 0; display: grid; gap: 8px; font-size: 14px; }
.lateral dt { font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; }
.lateral dd { margin: 0; }
.acoes-ong { display: grid; gap: 8px; }

/* ---------- Tela 4/5: formulários de conta ---------- */
.estreito { max-width: 760px; }
.perfis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@container site (max-width: 760px) { .perfis { grid-template-columns: 1fr; } }
.cartao-perfil { padding: 18px; display: grid; gap: 8px; text-align: left; cursor: pointer; color: var(--texto); align-content: start; }
.cartao-perfil[aria-pressed="true"] { border-color: var(--verde); box-shadow: 0 0 0 2px var(--verde); }
.cartao-perfil h3 { font-size: 17px; }
.cartao-perfil p { font-size: 13.5px; color: var(--suave); }
.cartao-perfil .icone { width: 40px; height: 40px; border-radius: 10px; background: var(--apoio); color: var(--sobre-apoio); display: grid; place-items: center; }
.formulario { padding: 22px; display: grid; gap: 18px; }
.formulario h2 { font-size: 21px; }
.login { max-width: 420px; margin: 0 auto; }

/* ---------- Tela 7: Ofertas ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--borda); background: var(--superficie); padding: 5px 14px; border-radius: 99px; font-size: 13.5px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--verde); color: var(--sobre-verde); border-color: var(--verde); font-weight: 600; }
.ofertas { display: grid; gap: 12px; }
.oferta { padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; align-items: start; }
.oferta.direcionada { border-color: var(--verde); }
.oferta .nome { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.oferta .nome h3 { font-size: 17px; }
.oferta .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--suave); }
.oferta .meta .dist { color: var(--link); font-weight: 700; }
.oferta .saldo { font-size: 14px; }
.oferta .saldo strong { color: var(--numero); font-size: 16px; }
.oferta .reservar { grid-column: 2; grid-row: 1 / span 4; display: grid; gap: 8px; justify-items: end; align-self: center; min-width: 170px; }
.oferta .reservar .qtd { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--suave); }
.oferta .reservar input { width: 80px; text-align: right; }
.oferta .retorno { grid-column: 1 / -1; }
@container site (max-width: 640px) {
  .oferta { grid-template-columns: 1fr; }
  .oferta .reservar { grid-column: 1; grid-row: auto; justify-items: start; }
}

/* ---------- Tela 8: Painel ---------- */
.indicadores { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@container site (max-width: 860px) { .indicadores { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.indicador { padding: 16px; display: grid; gap: 4px; }
.indicador .valor { font-family: var(--fonte-display); font-size: clamp(24px, 3.4cqi, 32px); font-weight: 800; color: var(--numero); font-variant-numeric: tabular-nums; }
.indicador .nome { font-size: 13.5px; color: var(--suave); }
.graficos { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
@container site (max-width: 860px) { .graficos { grid-template-columns: 1fr; } }
.grafico { padding: 18px; display: grid; gap: 12px; }
.grafico h3 { font-size: 17px; }
.grafico svg { width: 100%; height: auto; display: block; }
.grafico svg text { fill: var(--suave); font-size: 12px; font-family: var(--fonte-texto); }
.grafico svg .valor-barra { fill: var(--texto); font-weight: 700; }
.grafico svg .grade { stroke: var(--borda); stroke-width: 1; }
.grafico svg .barra-kg { fill: var(--verde); }
.grafico svg .barra-kg.ultima { fill: var(--limao); }
.fatias { display: grid; gap: 10px; }

}
function barra(confirmado, meta) {
  const pct = Math.min(100, Math.round(confirmado / meta * 100));
  return `<div class="barra${pct >= 100 ? ' cheia' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${pct}% da meta"><span style="width:${pct}%"></span></div>`;
}
function iniciais(nome) { return nome.split(' ').filter(p => p.length > 2).slice(0, 2).map(p => p[0]).join(''); }

}

}

function ongsFiltradas() {
  const f = estado.filtros;
  const q = f.q.trim().toLowerCase();
  return ONGS.filter(o => {
    if (f.ods && !o.ods.includes(Number(f.ods))) return false;
    if (f.tipo && !o['aceita_' + f.tipo]) return false;
    if (f.cidade && o.localidade !== f.cidade) return false;
    if (q) {
      const texto = [o.nome, o.localidade, ...o.ods.map(n => odsDe(n).nome)].join(' ').toLowerCase();
      if (!texto.includes(q)) return false;
    }
    return true;
  });
}

  return `<div class="largura"><section class="secao">

    </div>
    <div class="graficos">
      <div class="cartao grafico"><h3>Quilos recebidos por mês</h3>${vazio ? '<div class="vazio">Ainda não há colheitas recebidas. O gráfico aparece quando uma ONG confirmar o primeiro recebimento.</div>' : graficoKg()}</div>
      <div class="cartao grafico"><h3>Ações confirmadas por ODS</h3>${vazio ? '<div class="vazio">Sem ações confirmadas ainda.</div>' : `<div class="fatias">${PAINEL.ods.map(([n, pct]) => {
        const o = odsDe(n);
        return `<div class="fatia"><span>${seloOds(n)}</span><span class="num"><strong>${pct}%</strong></span><div class="barra"><span style="width:${pct}%; background:${o.cor}"></span></div></div>`;
      }).join('')}</div>`}</div>
    </div>
  </section></div>`;
};
function graficoKg() {
  const W = 520, H = 240, m = { t: 24, r: 8, b: 28, l: 44 }, max = 1200;
  const iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / PAINEL.kg.length;
  const y = v => m.t + ih - v / max * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Quilos recebidos por mês, de maio a outubro de 2026">`;
  [0, 300, 600, 900, 1200].forEach(v => { s += `<line class="grade" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; });
  PAINEL.kg.forEach(([mes, v], i) => {
    const x = m.l + i * bw + bw * .18, w = bw * .64, ultima = i === PAINEL.kg.length - 1;
    s += `<rect class="barra-kg${ultima ? ' ultima' : ''}" x="${x}" y="${y(v)}" width="${w}" height="${m.t + ih - y(v)}" rx="3"/>`;
    s += `<text class="valor-barra" x="${x + w / 2}" y="${y(v) - 6}" text-anchor="middle">${fmt(v)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${mes}</text>`;
  });
  return s + '</svg><p style="font-size:12.5px; color:var(--suave)">Mês da confirmação do recebimento. Outubro ainda em andamento.</p>';
}

      <div class="acoes"><button class="btn btn-contorno btn-pequeno" type="button" data-toast="Reserva cancelada. As 15 un voltaram ao saldo.">Cancelar a reserva</button><button class="btn btn-contorno btn-pequeno" type="button" disabled title="Só é possível cancelar ofertas sem reservas ativas">Cancelar oferta</button></div>

</section></div>`;

/* ---------- Área logada: pessoa ---------- */
R['pessoa-contribuicoes'] = () => {
  const linha = (titulo, ong, situacao, cls, data, cancelar) => `<article class="cartao linha-item">

    <div class="meta"><span>${ong}</span><span>${data}</span></div>
    ${cancelar ? `<div class="acoes"><button class="btn btn-contorno btn-pequeno" type="button" data-toast="Contribuição cancelada. A ONG deixa de esperar por ela.">Cancelar</button></div>` : ''}
  </article>`;
  return `<div class="largura"><section class="secao">
    ${cabecaConta('Minhas contribuições', 'Mariana Costa')}
    ${rastreio('pessoa-contribuicoes')}
    <div class="lista-itens">
      ${linha('10 cestas básicas', 'Cozinha Solidária Sol Nascente', 'Aguardando a ONG', 'selo-aviso', 'Prometida em 14/10', true)}
      ${linha('R$ 30,00 · doação livre', 'Casa Esperança Águas Lindas', 'Aguardando a ONG', 'selo-aviso', 'Registrada em 15/10', true)}
      ${linha('Voluntariado · cozinha aos sábados', 'Cozinha Solidária Sol Nascente', 'Confirmada', 'selo-apoio', 'Confirmada em 08/10', false)}
      ${linha('R$ 50,00 · máquinas de costura', 'Rede Mulheres do Cerrado', 'Confirmada', 'selo-apoio', 'Confirmada em 30/09', false)}
      ${linha('5 kits de material escolar', 'Instituto Semear Saberes', 'Recusada pela ONG', 'selo-perigo', 'Recusada em 25/09', false)}
    </div>
    <div class="cartao linha-item">

      <div class="acoes">${estado.agricultorTambemDoador ? '<span class="selo selo-apoio">Perfil de agricultor(a) ativo</span>' : '<button class="btn btn-contorno btn-pequeno" type="button" data-ativar-agricultor>Ativar perfil de agricultor(a)</button>'}</div>
    </div>
  </section></div>`;
};

/* ===================== Navegação ===================== */
const PERFIL_DA_TELA = Object.fromEntries(TELAS.map(t => [t[0], t[4]]));
function exigeLogin(tela) {
  const req = PERFIL_DA_TELA[tela];
  if (!req || req === 'visitante') return false;
  if (req === 'ong') return !ehOng();
  return estado.perfil !== req;
}
function ir(tela, { daBarra = false } = {}) {
  if (!R[tela]) tela = 'inicio';
  if (daBarra) {
    const req = PERFIL_DA_TELA[tela];
    if (req === 'visitante') definirPerfil('visitante');
    else if (req && exigeLogin(tela)) definirPerfil(req);
  } else if (exigeLogin(tela)) {
    estado.loginMotivo = tela === 'contribuir' ? `Entre para contribuir com ${ongDe(estado.ongId).nome}.` : 'Entre para continuar.';
    tela = 'login';
  }
  if (['ong-necessidades', 'ong-reservas', 'ong-doacoes'].includes(tela) && estado.perfil !== 'ong') tela = 'ong-conta';
  estado.tela = tela;
  if (location.hash !== '#' + tela) history.replaceState(null, '', '#' + tela);
  render();
  window.scrollTo({ top: 0 });
}
function definirPerfil(p) {
  estado.perfil = p; $('#sel-perfil').value = p; gravar('perfil', p);
}
function atualizarSetas() {
  const c = $('#carrossel-ongs'); if (!c) return;
  const [ant, prox] = document.querySelectorAll('[data-carrossel]');
  ant.disabled = c.scrollLeft <= 2;
  prox.disabled = c.scrollLeft + c.clientWidth >= c.scrollWidth - 2;
}
document.addEventListener('scroll', e => { if (e.target.id === 'carrossel-ongs') atualizarSetas(); }, true);
window.addEventListener('resize', atualizarSetas);
function render() {
  renderMenu();
  $('#conteudo').innerHTML = R[estado.tela]();
  atualizarSetas();
  $('#sel-tela').value = estado.tela;
  $('#menu').classList.remove('aberto'); $('#btn-menu').setAttribute('aria-expanded', 'false');
  document.title = 'Protótipo SustentAgro 2.0';
}

/* ===================== Regras demonstradas ===================== */
function cnpjValido(v) {
  const c = String(v).replace(/\D/g, '');
  if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const dv = n => { const pesos = n === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    const s = pesos.reduce((acc, p, i) => acc + p * Number(c[i]), 0) % 11; return s < 2 ? 0 : 11 - s; };
  return dv(12) === Number(c[12]) && dv(13) === Number(c[13]);
}
function reservar(id) {
  const o = OFERTAS.find(x => x.id === id), inp = $('#res-' + id), ret = $('#ret-' + id);
  const q = Number(inp.value);
  if (!(q > 0)) { ret.innerHTML = `<div class="aviso-caixa erro"><span>Informe uma quantidade maior que zero.</span></div>`; return; }
  if (o.unidade === 'un' && !Number.isInteger(q)) { ret.innerHTML = `<div class="aviso-caixa erro"><span>Esta oferta é em unidades: use um número inteiro.</span></div>`; return; }
  if (q > o.saldo) { ret.innerHTML = `<div class="aviso-caixa erro"><span>Só restam ${fmtQtd(o.saldo, o.unidade)} desta oferta. Diminua a quantidade.</span></div>`; return; }
  o.saldo = Math.round((o.saldo - q) * 10) / 10;
  render();
  const novo = $('#ret-' + id);
  const msg = `<div class="aviso-caixa info"><strong>Reserva feita: ${fmtQtd(q, o.unidade)} de ${esc(o.produto)}</strong><span>Combine a retirada com ${esc(o.agricultor)} · ${esc(o.telefone)}. A reserva está em <a href="#ong-reservas" data-ir="ong-reservas">Minhas reservas</a>.</span></div>`;
  if (novo) novo.innerHTML = msg; else toast(`Reserva feita: ${fmtQtd(q, o.unidade)} de ${o.produto}. A oferta saiu da lista porque o saldo acabou.`);
}

/* ===================== Eventos ===================== */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-ir],[data-sair],[data-ong],[data-filtro-ods],[data-limpar],[data-contribuir],[data-tipo],[data-perfil-cad],[data-dist],[data-reservar],[data-painel-vazio],[data-toast],[data-copiar-pix],[data-confirmar-doacao],[data-recusar-doacao],[data-ativar-agricultor],[data-carrossel]');
  if (!t) return;
  if (t.matches('a')) e.preventDefault();
  const d = t.dataset;
  if (d.ir) ir(d.ir);
  else if ('sair' in d) { definirPerfil('visitante'); ir('inicio'); toast('Você saiu da sua conta.'); }
  else if (d.ong) { estado.ongId = Number(d.ong); ir('ong'); }
  else if (d.filtroOds) { estado.filtros = { q: '', ods: d.filtroOds, tipo: '', cidade: '' }; ir('lista'); }
  else if ('limpar' in d) { estado.filtros = { q: '', ods: '', tipo: '', cidade: '' }; render(); }
  else if (d.contribuir) { estado.contribTipo = d.contribuir; ir('contribuir'); }
  else if (d.tipo) { estado.contribTipo = d.tipo; render(); }
  else if (d.perfilCad) { estado.perfilCadastro = d.perfilCad; render(); }
  else if (d.dist) { estado.dist = d.dist; render(); }
  else if (d.carrossel) {
    const c = $('#carrossel-ongs'), cartao = c.firstElementChild;
    const passo = cartao ? cartao.getBoundingClientRect().width + 14 : c.clientWidth;
    c.scrollBy({ left: Number(d.carrossel) * passo });
  }
  else if (d.reservar) reservar(Number(d.reservar));
  else if ('painelVazio' in d) { estado.painelVazio = !estado.painelVazio; render(); }
  else if (d.toast) toast(d.toast);
  else if ('copiarPix' in d) {
    const chave = $('#c-chave').textContent;
    Promise.resolve().then(() => navigator.clipboard.writeText(chave)).then(() => toast('Chave Pix copiada.'), () => toast('Selecione a chave e copie: ' + chave));
  }
  else if (d.confirmarDoacao) { $('#doa-' + d.confirmarDoacao).remove(); toast('Confirmado. A barra da necessidade avançou e a ação conta no painel.'); }
  else if (d.recusarDoacao) { $('#doa-' + d.recusarDoacao).remove(); toast('Recusado. A barra não muda e a pessoa vê a recusa em Minhas contribuições.'); }
  else if ('ativarAgricultor' in d) { estado.agricultorTambemDoador = true; render(); toast('Perfil de agricultor(a) ativado. "Colheita Solidária" agora leva a publicar oferta.'); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'form-busca') { estado.filtros = { q: $('#busca-inicio').value, ods: '', tipo: '', cidade: '' }; ir('lista'); }
  else if (f.id === 'form-filtros') render();
  else if (f.id === 'form-login') { definirPerfil('pessoa'); const volta = estado.loginMotivo.startsWith('Entre para contribuir') ? 'contribuir' : 'pessoa-contribuicoes'; estado.loginMotivo = ''; ir(volta); toast('Você entrou como Mariana Costa.'); }
  else if (f.id === 'form-cadastro') {
    if (estado.perfilCadastro === 'ong') {
      const msg = $('#cad-cnpj-msg');
      if (!cnpjValido($('#cad-cnpj').value)) { msg.className = 'erro'; msg.textContent = 'CNPJ inválido: os dígitos verificadores não conferem. Confira o número no cartão do CNPJ.'; $('#cad-cnpj').focus(); return; }
      definirPerfil('ong-pendente'); ir('ong-conta'); toast('Cadastro enviado. A ONG fica em análise até a aprovação.');
    } else if (estado.perfilCadastro === 'agricultor') { definirPerfil('agricultor'); ir('agricultor-ofertas'); toast('Conta criada. Você já pode publicar ofertas.'); }
    else { definirPerfil('pessoa'); ir('pessoa-contribuicoes'); toast('Conta criada. Bem-vinda, Mariana.'); }
  }
  else if (f.id === 'form-publicar') {
    const vender = $('#pub-vender').checked, preco = $('#pub-preco').value;
    if (vender && !(Number(preco) > 0)) { toast('Informe o preço para uma oferta de venda.'); $('#pub-preco').focus(); return; }
    if ($('#pub-data').value < '2026-10-16') { toast('A data "colher até" não pode estar no passado.'); return; }
    ir('agricultor-ofertas'); toast('Oferta publicada. As ONGs próximas já podem reservar.');
  }
  else if (f.id === 'form-contribuir') {
    const t = estado.contribTipo;
    toast(t === 'itens' ? 'Promessa registrada. Ela fica pendente até a ONG confirmar o recebimento.' : t === 'voluntariado' ? 'Inscrição enviada. A ONG entra em contato para combinar.' : 'Doação registrada. Faça o Pix; a ONG confirma quando o valor cair.');
    ir('pessoa-contribuicoes');
  }
  else if (f.id === 'form-receber') {
    const q = Number($('#rec-qtd').value);
    if (q < 0 || q > 15 || !Number.isInteger(q)) { $('#rec-msg').innerHTML = '<div class="aviso-caixa erro"><span>A quantidade recebida vai de 0 a 15 un.</span></div>'; return; }
    $('#rec-msg').innerHTML = q === 0
      ? '<div class="aviso-caixa alerta"><span>Registrado como não recebida. As 15 un voltaram ao saldo da oferta e nada conta no painel.</span></div>'
      : `<div class="aviso-caixa info"><span>Recebimento confirmado: ${q} un. A colheita conta no painel de impacto.</span></div>`;
  }
  else if (f.id === 'form-necessidade') toast('Necessidade publicada na página da ONG.');
  else if (f.id === 'form-perfil-ong') toast('Perfil salvo.');
});

document.addEventListener('change', e => {
  const id = e.target.id;
  if (['f-q', 'f-ods', 'f-tipo', 'f-cidade'].includes(id)) {
    estado.filtros = { q: $('#f-q').value, ods: $('#f-ods').value, tipo: $('#f-tipo').value, cidade: $('#f-cidade').value };
    render(); const el = document.getElementById(id); if (el) el.focus();
  }
  if (e.target.name === 'pub-destino') $('#pub-preco-campo').hidden = !$('#pub-vender').checked;
  if (e.target.name === 'c-destino') $('#c-nec-campo').hidden = $('#c-dest-livre').checked;
});

/* Controles do protótipo */
$('#sel-tela').innerHTML = TELAS.map((t, i) => `<option value="${t[0]}">${i + 1}. ${t[1]}</option>`).join('');
$('#sel-tela').addEventListener('change', e => ir(e.target.value, { daBarra: true }));
$('#sel-perfil').addEventListener('change', e => { definirPerfil(e.target.value); ir(estado.tela); });
$('#btn-menu').addEventListener('click', () => { const m = $('#menu'); const ab = m.classList.toggle('aberto'); $('#btn-menu').setAttribute('aria-expanded', String(ab)); });
$('#btn-celular').addEventListener('click', e => {
  const on = $('#palco').classList.toggle('celular'); e.currentTarget.setAttribute('aria-pressed', String(on)); gravar('celular', on ? '1' : ''); atualizarSetas();
});
$('#btn-rotulos').addEventListener('click', e => {
  const sem = document.body.classList.toggle('sem-rotulos'); e.currentTarget.setAttribute('aria-pressed', String(!sem));
});
function temaAtual() {
  const t = document.documentElement.dataset.theme;
  if (t) return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
$('#btn-tema').addEventListener('click', () => {
  const novo = temaAtual() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = novo; gravar('tema', novo);
  $('#btn-tema').textContent = novo === 'dark' ? 'Tema claro' : 'Tema escuro';
});
window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (t && t !== estado.tela) ir(t); });

/* Início */
(function iniciar() {
  const temaSalvo = ler('tema', ''); if (temaSalvo) document.documentElement.dataset.theme = temaSalvo;
  $('#btn-tema').textContent = temaAtual() === 'dark' ? 'Tema claro' : 'Tema escuro';
  if (ler('celular', '')) { $('#palco').classList.add('celular'); $('#btn-celular').setAttribute('aria-pressed', 'true'); }
  definirPerfil(ler('perfil', 'visitante'));
  // Parâmetros para capturas de tela: ?perfil=ong&tema=dark&celular=1&limpo=1&tipo=dinheiro
  const qp = new URLSearchParams(location.search);
  if (qp.get('perfil')) { estado.perfil = qp.get('perfil'); $('#sel-perfil').value = estado.perfil; }
  if (qp.get('tema')) document.documentElement.dataset.theme = qp.get('tema');
  if (qp.get('celular') === '1') { $('#palco').classList.add('celular'); $('#btn-celular').setAttribute('aria-pressed', 'true'); }
  if (qp.get('limpo') === '1') { document.body.classList.add('sem-rotulos'); $('.proto').hidden = true; }
  if (qp.get('tipo')) estado.contribTipo = qp.get('tipo');
  const inicial = location.hash.slice(1);
  ir(R[inicial] ? inicial : 'inicio', { daBarra: true });
})();
</script>
